[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meeting-cli"
version = "0.1.0"
description = "会议录制处理CLI：下载 → 转写 → 对比 → 总结"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "openai>=1.0",
    "faster-whisper>=1.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
meeting-cli = "meeting_cli.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
